<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Whiteboard</title>
  <style>
    :root {
      --ink: #242424; --muted: #616161; --line: #e5e5e5; --panel: #fff;
      --blue: #625ee8; --blue-soft: #eeedff; --shadow: 0 10px 30px #00000014;
      --workspace: #fafbff; --control-hover: #f2f2f7;
    }
    :root[data-theme="dark"] {
      --ink: #f3f3f7; --muted: #aaaac0; --line: #34354a; --panel: #20212d;
      --blue: #928fff; --blue-soft: #343451; --shadow: 0 12px 34px #00000055;
      --workspace: #171820; --control-hover: #30313f;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overflow: hidden; font-family: "Segoe UI", Arial, sans-serif; color: var(--ink); }
    body { background: var(--workspace); transition: background .28s ease, color .28s ease; }
    .topbar, .toolbar, .zoom, .menu, .slide-drawer, .slide-drawer-tab { transition: background .28s ease, border-color .28s ease, color .28s ease, box-shadow .28s ease, transform .24s cubic-bezier(.2,.8,.2,1); }
    :root[data-theme="dark"] .topbar,
    :root[data-theme="dark"] .toolbar,
    :root[data-theme="dark"] .zoom,
    :root[data-theme="dark"] .menu,
    :root[data-theme="dark"] .slide-drawer,
    :root[data-theme="dark"] .slide-drawer-tab { background: var(--panel); color: var(--ink); }
    :root[data-theme="dark"] .workspace { background: var(--workspace); }
    :root[data-theme="dark"] .canvas { background-color: #252735; }
    :root[data-theme="dark"] .canvas[data-background="dots"] { background-image: radial-gradient(#46485a 1px, transparent 1px); }
    :root[data-theme="dark"] .tool,
    :root[data-theme="dark"] .top-button,
    :root[data-theme="dark"] .zoom button { color: #d7d7e5; }
    :root[data-theme="dark"] .slide-drawer {
      background: #20212d;
      border-right-color: #34354a;
      color: #f3f3f7;
      box-shadow: 12px 0 34px #00000066;
    }
    :root[data-theme="dark"] .slide-drawer-tab {
      background: #20212d;
      border-color: #34354a;
      color: #f3f3f7;
      box-shadow: 5px 5px 16px #00000055;
    }
    :root[data-theme="dark"] .slide-drawer-header {
      background: #20212d;
      border-bottom-color: #34354a;
      color: #f3f3f7;
    }
    :root[data-theme="dark"] .slide-drawer-actions button {
      background: #2b2c3a;
      border-color: #414255;
      color: #e9e9f4;
    }
    :root[data-theme="dark"] .slide-drawer-actions button:hover {
      background: #343451;
      border-color: #928fff;
    }
    :root[data-theme="dark"] .slide-list { background: #1b1c27; }
    :root[data-theme="dark"] .slide-row { color: #e6e6ef; }
    :root[data-theme="dark"] .slide-row.active {
      background: #303149;
      border-color: #625ee8;
    }
    :root[data-theme="dark"] .slide-thumb {
      background: radial-gradient(#484a60 1px, transparent 1px) 0 0/9px 9px, #252735;
      border-color: #414255;
    }
    :root[data-theme="dark"] .slide-thumb.active {
      border-color: #928fff;
      box-shadow: 0 0 0 2px #928fff22;
    }
    :root[data-theme="dark"] .thumb-canvas {
      background-color: #252735;
    }
    :root[data-theme="dark"] .thumb-canvas.background-dots {
      background-image: radial-gradient(#46485a 1px, transparent 1px);
    }
    :root[data-theme="dark"] .thumb-canvas.background-lines {
      background-image: linear-gradient(#3b3d50 1px, transparent 1px), linear-gradient(90deg,#3b3d50 1px,transparent 1px);
    }
    :root[data-theme="dark"] .thumb-canvas.background-ruled {
      background-image: linear-gradient(#3d4a64 1px, transparent 1px);
    }
    :root[data-theme="dark"] .slide-name { color: #e6e6ef; }
    :root[data-theme="dark"] .top-button,
    :root[data-theme="dark"] .theme-button {
      background: #2b2c3a;
      border-color: #414255;
      color: #e6e6ef;
    }
    :root[data-theme="dark"] .top-button:hover,
    :root[data-theme="dark"] .theme-button:hover {
      background: #343451;
      border-color: #928fff;
      color: #ffffff;
    }
    :root[data-theme="dark"] .toolbar,
    :root[data-theme="dark"] .zoom,
    :root[data-theme="dark"] .object-actions {
      background: #20212d;
      border-color: #34354a;
    }
    :root[data-theme="dark"] .tool {
      background: transparent;
      color: #d7d7e5;
    }
    :root[data-theme="dark"] .tool:hover {
      background: #343451;
      color: #ffffff;
      box-shadow: 0 5px 14px #00000055;
    }
    :root[data-theme="dark"] .tool.active {
      background: #343451;
      color: #b5b2ff;
      box-shadow: inset 0 0 0 1px #928fff55;
    }
    :root[data-theme="dark"] .zoom button,
    :root[data-theme="dark"] .menu button,
    :root[data-theme="dark"] .object-actions button {
      background: transparent;
      color: #e6e6ef;
      border-color: #414255;
    }
    :root[data-theme="dark"] .zoom button:hover,
    :root[data-theme="dark"] .menu button:hover,
    :root[data-theme="dark"] .object-actions button:hover {
      background: #343451;
      color: #ffffff;
    }
    :root[data-theme="dark"] .menu,
    :root[data-theme="dark"] .settings,
    :root[data-theme="dark"] .shape-settings,
    :root[data-theme="dark"] .shape-menu,
    :root[data-theme="dark"] .eraser-menu,
    :root[data-theme="dark"] .export-menu {
      background: #20212d;
      border-color: #34354a;
      color: #e6e6ef;
    }
    :root[data-theme="dark"] .settings-title,
    :root[data-theme="dark"] .rgb-field {
      color: #d7d7e5;
    }
    :root[data-theme="dark"] .rgb-field,
    :root[data-theme="dark"] .rgb-field input {
      background: #292a38;
      border-color: #414255;
      color: #f3f3f7;
    }
    :root[data-theme="dark"] .settings {
      background: #20212d;
      border-color: #34354a !important;
      box-shadow: 0 22px 48px #00000070, 0 4px 14px #00000045;
    }
    :root[data-theme="dark"] .settings .swatch.selected {
      outline-color: #20212d;
      box-shadow: 0 0 0 2px #928fff, 0 7px 16px #928fff28;
    }
    :root[data-theme="dark"] .custom-color {
      background: #292a38;
      border-color: #414255;
    }
    :root[data-theme="dark"] .rgb-field {
      background: #292a38;
      border-color: #414255;
      color: #aaaac0;
    }
    :root[data-theme="dark"] .rgb-field:focus-within {
      background: #2f3040;
      border-color: #928fff;
      box-shadow: 0 0 0 3px #928fff18;
    }
    :root[data-theme="dark"] .rgb-field input { background: transparent; color: #f3f3f7; }
    :root[data-theme="dark"] .size-preview {
      background: linear-gradient(135deg,#292a38,#242632);
      border-color: #414255;
    }
    :root[data-theme="dark"] .ink-slider::-webkit-slider-runnable-track {
      background: linear-gradient(90deg,#343451,#414255);
    }
    :root[data-theme="dark"] .eraser-mode-options button {
      background:#292a38;
      border-color:#414255;
      color:#d7d7e5;
    }
    :root[data-theme="dark"] .eraser-mode-options button:hover {
      border-color:#928fff;
      color:#ffffff;
    }
    :root[data-theme="dark"] .eraser-mode-options button.selected {
      background:#343451;
      border-color:#928fff;
      color:#c2bfff;
    }
    @keyframes menuReveal { from { opacity: 0; transform: translate(-50%, 8px) scale(.98); } to { opacity: 1; transform: translate(-50%, 0) scale(1); } }
    .menu.open { animation: menuReveal .18s cubic-bezier(.2,.8,.2,1); }
    .menu.docked.open { animation: dockedMenuReveal .18s cubic-bezier(.2,.8,.2,1); }
    @keyframes dockedMenuReveal { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    .tool, .top-button, .theme-button, .slide-drawer-actions button, .slide-thumb, .slide-name { transition: background .18s ease, border-color .18s ease, color .18s ease, transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .18s ease; }
    .tool:active, .top-button:active, .theme-button:active, .slide-drawer-actions button:active { transform: scale(.94); }
    .slide-drawer-tab { top: 50%; transform: translateY(-50%); }
    .slide-drawer.open .slide-drawer-tab { transform: translateY(-50%) rotate(180deg); }
    .shape.selected { outline: 2px solid var(--blue); outline-offset: 5px; box-shadow: 0 0 0 7px #625ee81a; }
    .selection-marquee { position:absolute; z-index:12; display:none; border:1.5px dashed var(--blue); background:#625ee821; pointer-events:none; border-radius:3px; }
    .selection-marquee.open { display:block; }
    .stroke.selected path { filter: drop-shadow(0 0 2px #625ee8) drop-shadow(0 0 5px #625ee888); }
    .text-item.selected, .emoji-item.selected { outline: 2px solid var(--blue); outline-offset: 4px; border-radius: 4px; }
    .object-actions { position: fixed; z-index: 12; display: none; align-items:center; gap:4px; padding:5px; border:1px solid var(--line); border-radius:9px; background:var(--panel); box-shadow:0 10px 28px #00000028; }
    .object-actions.open { display:flex; animation: dockedMenuReveal .16s cubic-bezier(.2,.8,.2,1); }
    .object-actions button { min-width:30px; height:30px; border-radius:7px; color:var(--ink); }
    .object-actions button:hover { background:var(--blue-soft); color:var(--blue); }
    .text-item, .item { transition: box-shadow .16s ease, outline-color .16s ease, opacity .16s ease; }
    .toolbar, .zoom, .menu, .slide-drawer, .topbar, .theme-button, .tool, .share { transition-timing-function: cubic-bezier(.2,.8,.2,1); }
    button { font: inherit; border: 0; background: none; cursor: pointer; color: inherit; }
    .app { height: 100%; display: flex; flex-direction: column; }
    .topbar { height: 62px; display: flex; align-items: center; gap: 16px; padding: 0 22px; background: var(--panel); border-bottom: 1px solid var(--line); z-index: 4; }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 210px; }
    .brand a { color: inherit; text-decoration: none; }
    .brand-mark { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg,#807cff,#514bd5); position: relative; display:grid; place-items:center; }
    .brand-mark svg { width: 21px; height: 21px; fill: none; stroke: white; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; transform: rotate(-24deg); }
    .brand strong { font-size: 15px; font-weight: 700; }
    .board-name { color: var(--muted); font-size: 13px; padding-left: 14px; border-left: 1px solid var(--line); }
    .top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .theme-button { width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 50%; display:grid; place-items:center; background:var(--panel); transition:background .25s ease,transform .25s ease,border-color .25s ease; }
    .theme-button:hover { transform: rotate(12deg) scale(1.04); background:var(--blue-soft); }
    .top-button, .icon-button { padding: 8px 11px; border-radius: 8px; color: #4b4b4b; }
    .top-button:hover, .icon-button:hover, .tool:hover { background: #f2f2f7; transform: translateY(-1px); }
    .top-button, .tool, .zoom button, .share { transition: background .18s ease, color .18s ease, transform .18s ease, box-shadow .18s ease; }
    .share { padding: 9px 16px; color: white; background: var(--blue); border-radius: 20px; font-weight: 600; font-size: 13px; box-shadow: 0 4px 10px #625ee83d; }
    .share:hover { transform: translateY(-1px); box-shadow: 0 7px 16px #625ee852; }
    .avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: #f5b2c5; color: #7d2347; font-size: 12px; font-weight: 700; }
    .workspace { flex: 1; position: relative; overflow: hidden; background: #fafbff; }
    .canvas { position: absolute; inset: 0; cursor: default; touch-action: none; background-color: #fff; background-image: radial-gradient(#d8d9e1 1px, transparent 1px); background-size: 24px 24px; }
    .canvas.panning { cursor: grabbing !important; }
    .canvas.grid-none { background-image: none; background-color: #fff; }
    .canvas.grid-lines { background-image: linear-gradient(#e9e9ef 1px, transparent 1px), linear-gradient(90deg, #e9e9ef 1px, transparent 1px); background-size: 24px 24px; }
    .canvas.ruled { background-image: linear-gradient(#dce7f7 1px, transparent 1px); background-size: 100% 28px; }
    .world { position: absolute; left: 0; top: 0; transform-origin: 0 0; width: 1px; height: 1px; }
    .toolbar { position: absolute; z-index: 3; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; gap: 3px; align-items: center; padding: 7px; background: white; border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
    .tool { min-width: 43px; height: 38px; border-radius: 8px; display: grid; place-items: center; color: #444; position: relative; }
    .tool#moreShapes, .tool[data-tool="emoji"] { font-size: 23px; line-height: 1; }
    .tool.active { color: var(--blue); background: var(--blue-soft); }
    .tool svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .separator { width: 1px; height: 25px; background: var(--line); margin: 0 4px; }
    .zoom { position: absolute; z-index: 3; left: 20px; bottom: 24px; display: flex; align-items: center; gap: 2px; background: white; border: 1px solid var(--line); border-radius: 10px; padding: 5px; box-shadow: var(--shadow); }
    .zoom span { min-width: 46px; text-align: center; font-size: 12px; color: var(--muted); }
    .zoom button { width: 28px; height: 28px; border-radius: 6px; font-size: 18px; color: #555; }
    .zoom button:hover { background: #f2f2f7; }
    .slide-drawer { position: absolute; z-index: 9; left: 0; top: 0; bottom: 0; width: 236px; display: flex; flex-direction: column; background: #fff; border-right: 1px solid var(--line); box-shadow: 12px 0 30px #00000018; transform: translateX(-100%); transition: transform .24s ease; }
    .slide-drawer.open { transform: translateX(0); }
    .slide-drawer-tab { position: absolute; z-index: 10; left: 236px; top: 50%; width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid var(--line); border-left: 0; border-radius: 0 9px 9px 0; background: #fff; box-shadow: 5px 5px 16px #00000012; font-size: 18px; transform: translateY(-50%); transition: left .24s ease, transform .24s cubic-bezier(.2,.8,.2,1); }
    .slide-drawer.open .slide-drawer-tab { transform: translateY(-50%) rotate(180deg); }
    .slide-drawer-header { height: 58px; display:flex; align-items:center; justify-content:space-between; padding:0 12px 0 14px; border-bottom:1px solid var(--line); }
    .slide-drawer-header strong { font-size:13px; }
    .slide-drawer-actions { display:flex; gap:5px; }
    .slide-drawer-actions button { height:29px; min-width:29px; border:1px solid #ddd; border-radius:7px; background:#fff; }
    .slide-drawer-actions button:hover { background:var(--blue-soft); border-color:#c9c7ff; }
    .slide-list { flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:8px; }
    .slide-row { position:relative; display:grid; grid-template-columns:18px 76px minmax(0,1fr); align-items:center; gap:8px; min-height:58px; border:1px solid transparent; border-radius:9px; padding:5px; cursor:grab; }
    .slide-row.dragging { opacity:.55; }
    .slide-row.drag-over { border-top:2px solid var(--blue); }
    .slide-row.active { background:#f7f7ff; border-color:#d9d8ff; }
    .slide-check { width:16px; height:16px; accent-color:var(--blue); }
    .slide-thumb { position:relative; height:46px; overflow:hidden; border:1px solid #ddd; border-radius:7px; background:#fff; cursor:pointer; }
    .thumb-canvas { position:absolute; left:0; top:0; width:966px; height:515px; transform:scale(.078); transform-origin:top left; overflow:hidden; background:#fff; pointer-events:none; }
    .thumb-canvas.background-dots { background-image:radial-gradient(#d8d9e1 1px,transparent 1px); background-size:24px 24px; }
    .thumb-canvas.background-lines { background-image:linear-gradient(#e9e9ef 1px,transparent 1px),linear-gradient(90deg,#e9e9ef 1px,transparent 1px); background-size:24px 24px; }
    .thumb-canvas.background-ruled { background-image:linear-gradient(#dce7f7 1px,transparent 1px); background-size:100% 28px; }
    .thumb-world { position:absolute; left:0; top:0; width:1px; height:1px; }
    .thumb-ink { position:absolute; left:0; top:0; width:966px; height:515px; }
    .thumb-ink svg { width:966px; height:515px; }
    .slide-thumb.active { border:2px solid var(--blue); }
    .slide-name { border:0; background:transparent; text-align:left; font-size:12px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .print-preview { position: fixed; inset: 0; z-index: 20; display: none; flex-direction: column; background: #eceef4; }
    .print-preview.open { display: flex; }
    .print-preview-toolbar { height: 56px; flex: 0 0 56px; display:flex; align-items:center; justify-content:space-between; padding:0 18px; background:#fff; border-bottom:1px solid #ddd; }
    .print-preview-toolbar strong { font-size:14px; }
    .print-preview-toolbar button { border:0; border-radius:8px; background:#625ee8; color:#fff; padding:9px 14px; font-weight:600; }
    .print-preview-pages { flex:1; overflow:auto; display:flex; flex-direction:column; align-items:center; gap:18px; padding:18px; }
    .preview-slide { width:min(277mm, calc(100vw - 36px)); aspect-ratio:277/190; flex:0 0 auto; position:relative; background:#fff; box-shadow:0 8px 30px #0002; padding:7mm; page-break-after:always; }
    .preview-slide:last-child { page-break-after:auto; }
    .preview-slide-label { height:7mm; font-size:11px; color:#666; }
    .preview-slide-canvas { position:relative; width:100%; height:calc(100% - 7mm); overflow:hidden; border:1px solid #ddd; background:#fff; }
    .preview-slide-canvas .print-world { position:absolute; left:0; top:0; width:1px; height:1px; }
    .preview-slide-canvas .print-ink { position:absolute; inset:0; }
    .preview-slide-canvas .print-ink svg { width:100%; height:100%; }
    .preview-slide-canvas .item { position:absolute; }
    .preview-slide-canvas .shape { border:3px solid var(--shape-border,#625ee8); background:var(--shape-fill,#625ee822); }
    .preview-slide-canvas .note { width:190px; min-height:170px; padding:18px; box-shadow:0 5px 13px #00000018; font-size:15px; line-height:1.45; white-space:pre-wrap; }
    .preview-slide-canvas .note.yellow { background:#fff4a8; }
    .preview-slide-canvas .note.pink { background:#ffd2e0; }
    .preview-slide-canvas .note.blue { background:#cceeff; }
    .preview-slide-canvas .note.green { background:#d3f3cc; }
    .preview-slide-canvas .text-item { min-width:90px; font-size:27px; font-weight:500; color:#333; padding:8px; white-space:pre; }
    @media print {
      body > .app { display:none !important; }
      .print-preview { position:static; display:flex !important; background:#fff; }
      .print-preview-toolbar { display:none !important; }
      .print-preview-pages { display:block; padding:0; overflow:visible; }
      .preview-slide { width:297mm; height:210mm; border:0; box-shadow:none; padding:8mm; break-after:page; }
      .preview-slide-canvas { height:187mm; }
      body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
      @page{size:A4 landscape;margin:0}
    }
    .hint { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); color: #9a9ba8; text-align: center; pointer-events: none; }
    .hint h1 { font-size: 22px; font-weight: 500; color: #646575; margin: 0 0 7px; }
    .hint p { font-size: 13px; margin: 0; }
    .item { position: absolute; user-select: none; cursor: move; }
    .note { width: 190px; min-height: 170px; padding: 18px; box-shadow: 0 5px 13px #00000018; font-size: 15px; line-height: 1.45; white-space: pre-wrap; }
    .note[contenteditable="true"], .text-item[contenteditable="true"] { outline: 2px solid var(--blue); cursor: text; user-select: text; }
    .note.yellow { background: #fff4a8; } .note.pink { background: #ffd2e0; } .note.blue { background: #cceeff; } .note.green { background: #d3f3cc; }
    .text-item { min-width: 90px; font-size: 27px; font-weight: 500; color: #333; padding: 8px; white-space: pre; }
    .shape { border: 3px solid var(--shape-border, #625ee8); background: var(--shape-fill, #625ee822); }
    .circle { border-radius: 50%; }
    .triangle { clip-path: polygon(50% 0, 100% 100%, 0 100%); }
    .diamond { transform: rotate(45deg) scale(.72); }
    .line, .arrow { height: 3px !important; min-height: 3px; border: 0; background: var(--shape-border, #625ee8); transform-origin: 0 50%; }
    .arrow:after { content: ""; position: absolute; right: -2px; top: -6px; border-left: 12px solid var(--shape-border, #625ee8); border-top: 7px solid transparent; border-bottom: 7px solid transparent; }
    .star { clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 95%, 50% 72%, 21% 95%, 32% 57%, 2% 35%, 39% 35%); }
    .hexagon { clip-path: polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%); }
    .line-item { height: 3px; background: #625ee8; transform-origin: 0 50%; }
    .ink-layer { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 2; transform-origin: 0 0; }
    .wet-ink { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
    .stroke { position: absolute; overflow: visible; pointer-events: none; }
    .eraser-cursor { position: absolute; width: 32px; height: 32px; margin: -16px 0 0 -16px; border: 2px solid #625ee8; border-radius: 50%; background: #ffffff99; pointer-events: none; z-index: 3; display: none; }
